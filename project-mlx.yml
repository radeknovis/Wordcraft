include:
  - project.yml
name: WordcraftMLX
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0
targetTemplates:
  MLX:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WORDCRAFT_MLX
    dependencies:
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
targets:
  Wordcraft:
    templates: [MLX]
  WordcraftKeyboard:
    templates: [MLX]
