name: Wordcraft
options:
  bundleIdPrefix: com.wordcraft
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    WORDCRAFT_BUNDLE_ID: com.wordcraft.local
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Wordcraft:
    type: application
    platform: iOS
    sources:
      - path: Wordcraft/App
      - path: WordcraftShared
      - path: Wordcraft/Resources/LaunchScreen.storyboard
    info:
      path: Wordcraft/Resources/Info.plist
      properties:
        WordcraftAppGroup: group.$(WORDCRAFT_BUNDLE_ID)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDCRAFT_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Wordcraft/Resources/Wordcraft.entitlements
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: WordcraftKeyboard
        embed: true
  WordcraftKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: WordcraftKeyboard
      - path: WordcraftShared
    info:
      path: WordcraftKeyboard/Resources/Info.plist
      properties:
        WordcraftAppGroup: group.$(WORDCRAFT_BUNDLE_ID)
        CFBundleDisplayName: Wordcraft Keyboard
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDCRAFT_BUNDLE_ID).keyboard
        CODE_SIGN_ENTITLEMENTS: WordcraftKeyboard/Resources/WordcraftKeyboard.entitlements
        SKIP_INSTALL: true
  WordcraftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WordcraftUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WORDCRAFT_BUNDLE_ID).uitests
    dependencies:
      - target: Wordcraft
schemes:
  Wordcraft:
    build:
      targets:
        Wordcraft: all
        WordcraftKeyboard: all
    run:
      config: Debug
    test:
      targets: [WordcraftUITests]
